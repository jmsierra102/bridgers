<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Bridgers Youth Organization</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <header>
        <nav class="navbar">
            <a href="/" class="logo">
                <img src="images/logo.svg" alt="Bridgers Logo" style="height: 30px; width: auto;">
            </a>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/events">Events</a></li>
                <li><a href="/contact">Contact</a></li>
                <li><a href="/shop">Shop</a></li>
            </ul>
        </nav>
    </header>

    <!-- Page Title -->
    <section style="background: linear-gradient(135deg, #1a2332, #2c3e50); color: white; padding: 4rem 2rem; text-align: center;">
        <h1 style="font-size: 3rem; margin-bottom: 1rem;">Official Bridgers Merch</h1>
        <p style="font-size: 1.1rem; max-width: 600px; margin: 0 auto; opacity: 0.9;">Wear your support. Proceeds directly fund our youth programs.</p>
    </section>

    <!-- Products -->
    <section>
        <div class="products-grid" id="products-container">
            <!-- Products will be loaded here by JavaScript -->
        </div>
    </section>

    <!-- Footer -->
    <footer style="background-color: #000000; color: white; padding: 3rem 2rem; text-align: center;">
        <p>&copy; 2025 Bridgers Youth Organization. All rights reserved.</p>
        <p style="margin-top: 1rem; font-size: 0.9rem; opacity: 0.8;">100% of proceeds support our youth programs.</p>
    </footer>

    <script src="js/shop.js"></script>
</body>
</html>
